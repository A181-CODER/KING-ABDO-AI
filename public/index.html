<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑  KING ABDO AI</title>
    <link rel="icon" type="image/png" href="/G.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING ABDO AI - تسجيل الدخول الآمن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1a;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at top right, rgba(6, 182, 212, 0.15), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(139, 92, 246, 0.15), transparent 50%),
                radial-gradient(ellipse at center, rgba(236, 72, 153, 0.05), transparent 70%),
                linear-gradient(135deg, #0a0f1a 0%, #1e1b4b 50%, #0a0f1a 100%);
        }

        /* Neural Network Canvas */
        #neuralCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.4;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
        }

        /* Scanning Line */
        .scan-line {
            position: fixed;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, transparent);
            animation: scan 4s ease-in-out infinite;
            z-index: 3;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        /* Main Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Card Glow */
        .card-glow {
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            border-radius: 28px;
            filter: blur(20px);
            opacity: 0.3;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.02); }
        }

        /* Glass Card */
        .glass-card {
            position: relative;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            overflow: hidden;
        }

        .card-top-line {
            height: 4px;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
        }

        .card-content {
            padding: 40px;
        }

        /* AI Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .ai-logo {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: spin 8s linear infinite;
        }

        .logo-ring-1 {
            border-top-color: #06b6d4;
            border-right-color: #06b6d4;
        }

        .logo-ring-2 {
            inset: 8px;
            animation-direction: reverse;
            animation-duration: 6s;
            border-bottom-color: #8b5cf6;
            border-left-color: #8b5cf6;
        }

        .logo-ring-3 {
            inset: 16px;
            animation-duration: 10s;
            border-top-color: #ec4899;
            border-right-color: #ec4899;
        }

        .logo-core {
            position: absolute;
            inset: 24px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .logo-core svg {
            width: 32px;
            height: 32px;
            color: #06b6d4;
        }

        .orbit-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        .orbit-dot-1 {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #06b6d4;
            box-shadow: 0 0 10px #06b6d4;
        }

        .orbit-dot-2 {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #8b5cf6;
            box-shadow: 0 0 10px #8b5cf6;
            animation-direction: reverse;
        }

        .orbit-dot-3 {
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: #ec4899;
            box-shadow: 0 0 10px #ec4899;
            animation-duration: 10s;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Typography */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .title .cursor {
            display: inline-block;
            width: 2px;
            height: 28px;
            background: #8b5cf6;
            margin-right: 4px;
            animation: blink 1s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .version-badge {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: #06b6d4;
        }

        .badge-container {
            text-align: center;
            margin-bottom: 24px;
        }

        /* Security Badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(6, 182, 212, 0.1));
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .security-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .security-text {
            font-size: 12px;
            color: #10b981;
            font-weight: 500;
        }

        .security-divider {
            width: 1px;
            height: 16px;
            background: #334155;
        }

        .security-item svg {
            width: 16px;
            height: 16px;
        }

        .text-cyan { color: #06b6d4; }
        .text-purple { color: #8b5cf6; }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-label svg {
            width: 16px;
            height: 16px;
        }

        .input-wrapper {
            position: relative;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper.focused {
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }

        .input-wrapper.focused.purple {
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
        }

        .input-glow {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper.focused .input-glow {
            opacity: 1;
        }

        .input-glow.cyan {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1));
        }

        .input-glow.purple {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper.focused .input-icon {
            color: #06b6d4;
            transform: translateY(-50%) scale(1.1);
        }

        .input-wrapper.focused.purple .input-icon {
            color: #8b5cf6;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
        }

        .form-input {
            width: 100%;
            padding: 16px 48px 16px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .form-input:focus {
            border-color: rgba(6, 182, 212, 0.5);
        }

        .form-input.purple:focus {
            border-color: rgba(139, 92, 246, 0.5);
        }

        .password-input {
            padding-left: 56px;
            font-family: monospace;
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #8b5cf6;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 12px;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .strength-bar.active {
            box-shadow: 0 0 8px currentColor;
        }

        .strength-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .strength-label {
            font-weight: 500;
        }

        .strength-encryption {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #64748b;
        }

        .strength-encryption svg {
            width: 12px;
            height: 12px;
        }

        /* Options Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #475569;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkbox-wrapper:hover .custom-checkbox {
            border-color: rgba(6, 182, 212, 0.5);
        }

        .checkbox-wrapper.checked .custom-checkbox {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }

        .custom-checkbox svg {
            width: 12px;
            height: 12px;
            color: white;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .checkbox-wrapper.checked .custom-checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .checkbox-label {
            font-size: 14px;
            color: #94a3b8;
        }

        .forgot-link {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: #06b6d4;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #22d3ee;
        }

        .forgot-link svg {
            width: 16px;
            height: 16px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0891b2, #7c3aed, #db2777);
            transition: opacity 0.3s ease;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .submit-btn:hover::after {
            opacity: 1;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-content svg {
            width: 20px;
            height: 20px;
        }

        .btn-arrow {
            transition: transform 0.3s ease;
        }

        .submit-btn:hover .btn-arrow {
            transform: translateX(-4px);
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Divider */
        .divider {
            position: relative;
            margin: 28px 0;
            text-align: center;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(71, 85, 105, 0.3);
        }

        .divider span {
            position: relative;
            padding: 0 16px;
            background: rgba(15, 23, 42, 0.9);
            color: #64748b;
            font-size: 14px;
        }

        /* Biometric Buttons */
        .biometric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .biometric-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .biometric-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .biometric-btn.cyan::before {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), transparent);
        }

        .biometric-btn.purple::before {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), transparent);
        }

        .biometric-btn.pink::before {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), transparent);
        }

        .biometric-btn:hover::before {
            opacity: 1;
        }

        .biometric-btn:hover {
            transform: translateY(-2px);
        }

        .biometric-btn.cyan:hover {
            border-color: rgba(6, 182, 212, 0.5);
        }

        .biometric-btn.purple:hover {
            border-color: rgba(139, 92, 246, 0.5);
        }

        .biometric-btn.pink:hover {
            border-color: rgba(236, 72, 153, 0.5);
        }

        .biometric-btn svg {
            width: 28px;
            height: 28px;
            color: #64748b;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .biometric-btn.cyan:hover svg { color: #06b6d4; }
        .biometric-btn.purple:hover svg { color: #8b5cf6; }
        .biometric-btn.pink:hover svg { color: #ec4899; }

        .biometric-btn span {
            font-size: 12px;
            color: #64748b;
            transition: color 0.3s ease;
        }

        .biometric-btn.cyan:hover span { color: #06b6d4; }
        .biometric-btn.purple:hover span { color: #8b5cf6; }
        .biometric-btn.pink:hover span { color: #ec4899; }

        /* Signup Link */
        .signup-text {
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 14px;
        }

        .signup-link {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .signup-link:hover {
            opacity: 0.8;
        }

        /* Card Footer */
        .card-footer {
            padding: 16px 40px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid rgba(71, 85, 105, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
            color: #475569;
            flex-wrap: wrap;
        }

        .card-footer a {
            color: #475569;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .card-footer a:hover {
            color: #94a3b8;
        }

        /* Verification Step */
        .verification-container {
            display: none;
        }

        .verification-container.show {
            display: block;
        }

        .login-form {
            display: block;
        }

        .login-form.hide {
            display: none;
        }

        .verification-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verification-icon svg {
            width: 40px;
            height: 40px;
            color: #10b981;
        }

        .verification-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .verification-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .verification-email {
            text-align: center;
            color: #06b6d4;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .code-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            direction: ltr;
        }

        .code-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-family: monospace;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #059669, #0891b2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
        }

        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .verify-btn svg {
            width: 20px;
            height: 20px;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-content {
                padding: 30px 24px;
            }

            .security-badge {
                gap: 10px;
            }

            .security-divider {
                display: none;
            }

            .code-input {
                width: 42px;
                height: 52px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-gradient"></div>
    
    <!-- Neural Network Canvas -->
    <canvas id="neuralCanvas"></canvas>
    
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Scanning Line -->
    <div class="scan-line"></div>

    <!-- Main Container -->
    <div class="login-container">
        <!-- Card Glow -->
        <div class="card-glow"></div>
        
        <!-- Glass Card -->
        <div class="glass-card">

    <script>
        // ✅ منع زر الماوس الأيمن — مع استثناء حقل كلمة المرور
        document.addEventListener('contextmenu', function(e) {
            // ✅ السماح فقط إذا كان النقر فوق حقل كلمة المرور
            if (e.target.id === 'password') {
                return true; // نسمح بقائمة المتصفح (مثل "Suggest Strong Password")
            }
            e.preventDefault(); // منع القائمة في كل مكان آخر
            return false;
        });

        async function login() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!username || !email || !password) {
                alert('⚠️ الرجاء إدخال جميع البيانات.');
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('❌ Invalid email: صيغة البريد غير صحيحة.');
                return;
            }
            const localPart = email.split('@')[0];
            if (localPart.includes('.')) {
                alert('❌ Invalid email: البريد يحتوي على نقطة (.) — غير مسموح.');
                return;
            }
            if (!email.endsWith('@gmail.com') && !email.endsWith('@icloud.com') && !email.endsWith('@outlook.com')) {
                alert('❌ Invalid email: يُسمح فقط ببريد Gmail أو iCloud أو Outlook.');
                return;
            }
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&_\-])[A-Za-z\d@$!%*?&_\-]{8,}$/;
            if (!passwordRegex.test(password)) {
                alert('❌ كلمة المرور ضعيفة: يجب أن تحتوي على 8 أحرف على الأقل، وتشمل حرف كبير، رقم، ورمز خاص (!@#$%^&*).');
                return;
            }
            const verificationCode = Math.floor(1000 + Math.random() * 9000);
            alert(`👑 يا ${username}، رمز التحقق الخاص بك هو: ${verificationCode}`);
            const userCode = prompt('👑 أدخل رمز التحقق المكون من 4 أرقام:');
            if (userCode == verificationCode) {
                try {
                    await fetch('/api/notify-owner', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            userEmail: email,
                            userPassword: password
                        })
                    });
                } catch (err) {
                    // نمر بصمت
                }
                // ✅ حفظ حالة الدخول في localStorage
                localStorage.setItem('kingAbdoLoggedIn', 'true');
                localStorage.setItem('kingAbdoUsername', username);
                alert('✅ تم التحقق بنجاح! أهلاً بك في البلاط الملكي.');
                window.location.href = 'chat.html';
            } else {
                alert('❌ رمز التحقق غير صحيح. حاول مرة أخرى.');
            }
        }

        function signup() {
            alert('👑 سيتم توجيهك لتسجيل حساب جديد في البلاط...');
        }
    </script>
