<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النخبة | Elite Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Base Reset & Variables */
        :root {
            --bg-color: #050505;
            --card-bg: rgba(0, 0, 0, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.3);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #eab308;
            --success: #22c55e;
            --font-main: 'Tajawal', sans-serif;
            --font-head: 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevent scroll from background blobs */
            position: relative;
        }

        /* Background Effects */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 0;
            animation: pulse-blob 8s infinite alternate;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #1e3a8a; /* Blue */
        }
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: #581c87; /* Purple */
            animation-delay: 1s;
        }

        @keyframes pulse-blob {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.4; }
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            z-index: 0;
            pointer-events: none;
        }

        /* Card Container */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            border-radius: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            margin: 1rem;
        }

        .login-card:hover, .login-card.focused {
            border-color: rgba(245, 158, 11, 0.2);
            box-shadow: 0 25px 50px -12px rgba(245, 158, 11, 0.1);
        }

        /* Top Glow Line */
        .glow-line {
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0.5;
        }

        /* Header & Orb */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .orb-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .orb-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, transparent 70%);
            filter: blur(15px);
            transition: all 0.5s ease;
        }

        .orb-core {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Orb States */
        /* Idle */
        .orb-core svg {
            color: #94a3b8;
            width: 40px;
            height: 40px;
            transition: color 0.3s;
        }
        
        /* Listening (Focus) */
        .state-listening .orb-core {
            border-color: var(--accent-gold);
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }
        .state-listening .orb-core svg {
            color: var(--accent-gold);
        }
        .state-listening .orb-ring {
            opacity: 1;
            animation: spin 3s linear infinite;
        }

        /* Processing (Submit) */
        .state-processing .orb-core {
            animation: pulse-processing 1s infinite;
            border-color: #8b5cf6; /* Purple for AI processing */
        }
        .state-processing .orb-core svg {
            color: #8b5cf6;
        }

        .orb-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px dashed var(--accent-gold);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .status-badge {
            margin-top: -10px;
            z-index: 5;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .state-listening ~ .status-badge {
            color: var(--accent-gold);
            border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.1);
        }

        h1 {
            font-family: var(--font-head);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 span {
            background: linear-gradient(to right, #fcd34d, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem; /* Right padding for icon */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            color: white;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(245, 158, 11, 0.5);
        }

        .form-group:focus-within .input-icon {
            color: var(--accent-gold);
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .password-toggle:hover {
            color: white;
        }

        /* Password Strength */
        .strength-meter {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            height: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .strength-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s;
        }
        .strength-text {
            font-size: 0.7rem;
            margin-top: 4px;
            text-align: left;
            display: block;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Checkbox & Links */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-muted);
            gap: 8px;
        }
        .checkbox-container:hover {
            color: #fff;
        }
        
        .custom-checkbox {
            width: 18px;
            height: 18px;
            border: 1px solid var(--text-muted);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        input[type="checkbox"] {
            display: none;
        }
        
        input[type="checkbox"]:checked + .custom-checkbox {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .check-icon {
            display: none;
            color: black;
            width: 12px;
            height: 12px;
        }
        
        input[type="checkbox"]:checked + .custom-checkbox .check-icon {
            display: block;
        }

        a.forgot-pass {
            color: var(--accent-gold);
            text-decoration: none;
            transition: color 0.2s;
        }
        a.forgot-pass:hover {
            color: #fbbf24; /* lighter gold */
        }

        /* Submit Button */
        .btn-submit {
            position: relative;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        /* Divider */
        .divider {
            margin: 2rem 0;
            position: relative;
            text-align: center;
        }
        .divider::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
            z-index: 0;
        }
        .divider span {
            position: relative;
            z-index: 1;
            background: var(--bg-color); /* Matches bg, or needs to match card if transparent? */
            /* Using a trick for transparent card: give it a dark bg or backdrop */
            background: #151515; /* Approximate dark color */
            padding: 0 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-radius: 10px;
        }

        /* Social/Bio Buttons */
        .bio-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .btn-bio {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-bio:hover {
            background: rgba(255,255,255,0.1);
            color: var(--accent-gold);
            border-color: rgba(245, 158, 11, 0.3);
            transform: scale(1.1);
        }

        /* Security Footer */
        .security-footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .secure-icon {
            color: var(--success);
        }

        /* Keyframes */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-processing {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(139, 92, 246, 0); }
            50% { transform: scale(0.95); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(139, 92, 246, 0); }
        }

        /* Icons SVG Sizing */
        svg {
            width: 20px;
            height: 20px;
        }

        /* Verification Code Styles */
        .code-display {
            background: rgba(0,0,0,0.5);
            border: 1px dashed var(--accent-gold);
            color: var(--accent-gold);
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.5rem;
            text-align: center;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            user-select: none;
            text-shadow: 0 0 10px var(--accent-gold-glow);
            position: relative;
            overflow: hidden;
        }
        
        .code-display::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #verificationSection {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="grid-bg"></div>

    <div class="login-card" id="card">
        <div class="glow-line"></div>

        <div class="header">
            <div class="orb-container" id="orbContainer">
                <div class="orb-glow"></div>
                <div class="orb-ring"></div>
                <div class="orb-core">
                    <!-- CPU Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                    </svg>
                </div>
            </div>
            <div class="status-badge" id="statusBadge">System Idle</div>
            
            <h1>بوابة <span>النخبة</span></h1>
            <p class="subtitle">سجل دخولك إلى المستقبل</p>
        </div>

        <form id="loginForm">
            <!-- Email -->
            <div class="form-group">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                    <button type="button" class="password-toggle" id="togglePassword" title="عرض كلمة المرور">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeOffIcon" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
                
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar"><div class="strength-fill"></div></div>
                    <div class="strength-bar"><div class="strength-fill"></div></div>
                    <div class="strength-bar"><div class="strength-fill"></div></div>
                    <div class="strength-bar"><div class="strength-fill"></div></div>
                </div>
                <span class="strength-text" id="strengthText">ضعيف</span>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <label class="checkbox-container">
                    <input type="checkbox">
                    <span class="custom-checkbox">
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                    تذكرني
                </label>
                <a href="#" class="forgot-pass">نسيت الرمز؟</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnText">تسجيل الدخول</span>
                <svg id="arrowIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </form>

        <!-- Verification Section -->
        <div id="verificationSection" style="display: none;">
            <p style="text-align:center; color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">للأمان الإضافي، يرجى كتابة الرمز التالي:</p>
            
            <div class="code-display" id="generatedCodeDisplay">----</div>
            
            <div class="form-group">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="text" id="verificationInput" placeholder="أدخل الرمز هنا" maxlength="4" style="text-align:center; letter-spacing: 5px; font-weight: bold; font-size: 1.2rem;">
                </div>
            </div>

            <button type="button" class="btn-submit" id="verifyBtn">
                <span id="verifyBtnText">تحقق والدخول</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
        </div>

        <div class="divider" id="socialDivider">
            <span>أو باستخدام</span>
        </div>

        <div class="bio-buttons">
            <button class="btn-bio" title="بصمة الإصبع">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.131A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.2-2.858.571-4.175m4.271 2.508a6.002 6.002 0 0111.458 0" />
                </svg>
            </button>
            <button class="btn-bio" title="مسح الوجه">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
                    <!-- Using a generic scan icon for simplicity as exact Face ID icon paths can be complex -->
                     <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                     <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                </svg>
            </button>
        </div>

        <div class="security-footer">
            <svg class="secure-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <span>محمي بتشفير 256-bit AES</span>
        </div>
    </div>

    <script>
        // DOM Elements
        const orbContainer = document.getElementById('orbContainer');
        const statusBadge = document.getElementById('statusBadge');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginForm = document.getElementById('loginForm');
        const card = document.getElementById('card');
        const strengthMeter = document.getElementById('strengthMeter');
        const strengthFills = document.querySelectorAll('.strength-fill');
        const strengthText = document.getElementById('strengthText');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const arrowIcon = document.getElementById('arrowIcon');
        
        // Verification Elements
        const verificationSection = document.getElementById('verificationSection');
        const generatedCodeDisplay = document.getElementById('generatedCodeDisplay');
        const verificationInput = document.getElementById('verificationInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const verifyBtnText = document.getElementById('verifyBtnText');
        const socialDivider = document.getElementById('socialDivider');
        const bioButtons = document.querySelector('.bio-buttons');

        let generatedCode = '';

        // State Management
        let aiState = 'idle'; // idle, listening, processing

        function setAiState(newState) {
            aiState = newState;
            orbContainer.className = 'orb-container'; // reset
            
            if (newState === 'listening') {
                orbContainer.classList.add('state-listening');
                statusBadge.textContent = 'Listening...';
                statusBadge.style.color = '#f59e0b';
            } else if (newState === 'processing') {
                orbContainer.classList.add('state-processing');
                statusBadge.textContent = 'Processing Data';
                statusBadge.style.color = '#8b5cf6';
            } else {
                statusBadge.textContent = 'System Idle';
                statusBadge.style.color = '#94a3b8';
            }
        }

        // Event Listeners for Focus/Blur
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('focus', () => {
                card.classList.add('focused');
                if (aiState !== 'processing') setAiState('listening');
            });
            input.addEventListener('blur', () => {
                card.classList.remove('focused');
                if (aiState !== 'processing') setAiState('idle');
            });
        });

        // Password Strength Logic
        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length > 0) {
                strengthMeter.style.opacity = '1';
                strengthText.style.opacity = '1';
            } else {
                strengthMeter.style.opacity = '0';
                strengthText.style.opacity = '0';
            }

            let score = 0;
            if (val.length > 5) score++;
            if (val.length > 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            
            // Update UI
            strengthFills.forEach((fill, index) => {
                if (index < score) {
                    fill.style.width = '100%';
                    if (score <= 1) fill.style.backgroundColor = '#ef4444'; // Red
                    else if (score <= 3) fill.style.backgroundColor = '#eab308'; // Yellow
                    else fill.style.backgroundColor = '#22c55e'; // Green
                } else {
                    fill.style.width = '0%';
                }
            });

            if (score <= 1) strengthText.textContent = "ضعيف";
            else if (score <= 3) strengthText.textContent = "متوسط";
            else strengthText.textContent = "قوي";
        });

        // Toggle Password
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
        });

        // Submit Handler (Step 1)
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            setAiState('processing');
            submitBtn.disabled = true;
            btnSpinner.style.display = 'block';
            arrowIcon.style.display = 'none';
            btnText.textContent = 'تحليل البيانات...';

            setTimeout(() => {
                // Hide Login Form & Socials
                loginForm.style.display = 'none';
                socialDivider.style.display = 'none';
                bioButtons.style.display = 'none';
                
                // Show Verification
                verificationSection.style.display = 'block';
                
                // Generate 4-digit Code
                generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
                generatedCodeDisplay.textContent = generatedCode;
                
                // Reset State for Input
                setAiState('waiting'); 
                statusBadge.textContent = 'Security Check';
                statusBadge.style.color = '#eab308';
                
                // Focus on new input
                verificationInput.focus();

            }, 1500);
        });

        // Verification Handler (Step 2)
        verifyBtn.addEventListener('click', () => {
            const userCode = verificationInput.value;
            
            if (userCode === generatedCode) {
                setAiState('processing');
                verifyBtnText.textContent = 'جارِ التوجيه...';
                verifyBtn.disabled = true;
                
                // Simulate redirect delay
                setTimeout(() => {
                    window.location.href = 'https://king-abdo-ai-26dd.vercel.app/chat.html';
                }, 1000);
            } else {
                // Error Animation
                verificationInput.style.borderColor = '#ef4444';
                verificationInput.classList.add('shake');
                setTimeout(() => {
                    verificationInput.classList.remove('shake');
                    verificationInput.style.borderColor = '';
                }, 500);
            }
        });

        // Add shake animation class dynamically
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shake {
                0% { transform: translateX(0); }
                25% { transform: translateX(5px); }
                50% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
                100% { transform: translateX(0); }
            }
            .shake {
                animation: shake 0.3s ease-in-out;
                border-color: #ef4444 !important;
                background: rgba(239, 68, 68, 0.1) !important;
            }
        `;
        document.head.appendChild(styleSheet);

        document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
    </script>
</body>
</html>
