            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 30px;
            direction: rtl;
        }
        pre {
            font-size: 10px;
            line-height: 1.0;
            white-space: pre;
            color: #ff6b6b;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            display: inline-block;
            text-align: center;
        }
        h1 {
            color: #ff6b6b;
            font-size: 2rem;
            margin-top: 10px;
        }
        p {
            font-size: 1.2rem;
            margin: 15px 0;
        }
        .choices {
            margin: 30px 0;
        }
        button {
            background-color: #1b263b;
            color: #41b3a3;
            border: 2px solid #41b3a3;
            padding: 12px 25px;
            margin: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #41b3a3;
            color: #0d1b2a;
        }
        #ascii-container {
            margin-top: 20px;
            text-align: center;
        }
    </style>
